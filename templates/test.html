<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>棋盘数据与规则自测</title>
<style>
  body {
    margin: 0; padding: 32px 40px;
    background: #16120e; color: #efe6d8;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 1px; }
  .sub { color: #9a8b77; font-size: 12.5px; margin: 0 0 22px; }
  ul { list-style: none; margin: 0; padding: 0; max-width: 900px; }
  li {
    display: flex; gap: 12px; align-items: baseline;
    padding: 9px 14px; border-radius: 8px; font-size: 13.5px;
    background: #221b14; margin-bottom: 6px; border: 1px solid #322820;
  }
  li .tag {
    flex: 0 0 42px; font-size: 11px; font-weight: 700; text-align: center;
    padding: 2px 0; border-radius: 4px;
  }
  li.ok .tag { background: rgba(74,222,128,.16); color: #4ade80; }
  li.no .tag { background: rgba(239,83,80,.16); color: #ef5350; }
  li .name { flex: 1 1 auto; }
  li .msg { color: #b08e6a; font-size: 12px; }
  .sum { margin-top: 20px; font-size: 15px; font-weight: 700; }
  .sum.ok { color: #4ade80; }
  .sum.no { color: #ef5350; }
</style>
</head>
<body>
<h1>棋盘数据与规则自测</h1>
<p class="sub">37 点国王与大臣棋 · 数据源 core/board.py · 规则对齐 core/rules.py · 共 16 项</p>
<ul id="out"></ul>
<div class="sum" id="sum"></div>

<script src="../static/js/board_data.js"></script>
<script src="../static/js/rules_stub.js"></script>
<script>
(function () {
  'use strict';

  const L = window.BOARD_LAYOUT;
  const R = window.RULES;
  const N = L.nodeCount;
  const out = document.getElementById('out');
  let pass = 0, fail = 0;

  const KING = R.KING, MIN = R.MIN, EMPTY = R.EMPTY;

  function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  /* 造一个状态，默认开局 */
  function mk(o) {
    return Object.assign({
      board: L.initBoard.slice(),
      turn: L.firstPlayer,
      phase: 1,
      inHand: L.sheepInHand,
      captured: 0,
      ply: 0,
    }, o || {});
  }

  function test(name, fn) {
    const li = document.createElement('li');
    const tag = document.createElement('span');
    tag.className = 'tag';
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = name;
    const msg = document.createElement('span');
    msg.className = 'msg';

    let ok = false;
    try {
      const r = fn();
      ok = r === true;
      if (!ok && typeof r === 'string') msg.textContent = r;
    } catch (e) {
      msg.textContent = '异常: ' + e.message;
    }

    li.className = ok ? 'ok' : 'no';
    tag.textContent = ok ? 'PASS' : 'FAIL';
    li.appendChild(tag);
    li.appendChild(nm);
    li.appendChild(msg);
    out.appendChild(li);

    ok ? pass++ : fail++;
  }

  /* 1 */
  test('棋盘节点数为 37', function () {
    if (L.nodeCount !== 37) return '实际 ' + L.nodeCount;
    if (L.nodes.length !== 37) return '坐标条数 ' + L.nodes.length;
    return true;
  });

  /* 2 */
  test('连边 76 条，无重边、无自连、无孤立点', function () {
    if (L.edges.length !== 76) return '实际 ' + L.edges.length;
    const seen = {};
    const deg = new Array(N).fill(0);
    for (let i = 0; i < L.edges.length; i++) {
      const a = L.edges[i][0], b = L.edges[i][1];
      if (a === b) return '自连边 ' + a;
      const k = Math.min(a, b) + '-' + Math.max(a, b);
      if (seen[k]) return '重复边 ' + k;
      seen[k] = 1;
      deg[a]++; deg[b]++;
    }
    for (let i = 0; i < N; i++) if (deg[i] === 0) return i + ' 号点是孤立点';
    return true;
  });

  /* 3 */
  test('邻接表与边表双向一致', function () {
    const edge = {};
    for (let i = 0; i < L.edges.length; i++) {
      edge[Math.min(L.edges[i][0], L.edges[i][1]) + '-' + Math.max(L.edges[i][0], L.edges[i][1])] = 1;
    }
    for (let i = 0; i < N; i++) {
      for (let a = 0; a < L.adj[i].length; a++) {
        const j = L.adj[i][a];
        const k = Math.min(i, j) + '-' + Math.max(i, j);
        if (!edge[k]) return '邻接表多出边 ' + k;
        if (L.adj[j].indexOf(i) < 0) return '边 ' + k + ' 不是双向的';
      }
    }
    return true;
  });

  /* 4 */
  test('开局 2 王在 8/28 号点，8 大臣在 12/13/14/17/19/22/23/24 号点', function () {
    const kings = [], mins = [];
    for (let i = 0; i < N; i++) {
      if (L.initBoard[i] === KING) kings.push(i);
      if (L.initBoard[i] === MIN) mins.push(i);
    }
    if (!eq(kings, [8, 28])) return '王在 ' + kings;
    if (!eq(mins, [12, 13, 14, 17, 19, 22, 23, 24])) return '大臣在 ' + mins;
    return true;
  });

  /* 5 */
  test('先手是王，大臣手里另有 16 枚（8 在场 + 16 = 24）', function () {
    if (L.firstPlayer !== KING) return '先手是 ' + L.firstPlayer;
    if (L.sheepInHand !== 16) return '手里 ' + L.sheepInHand;
    if (L.initBoard.filter(function (v) { return v === MIN; }).length + L.sheepInHand !== 24) return '总数不是 24';
    return true;
  });

  /* 6 */
  test('添子阶段：空点 27 个，合法走法全是 place', function () {
    const st = mk({ turn: MIN });
    const mv = R.legalMoves(st);
    if (mv.length !== 27) return '走法数 ' + mv.length;
    for (let i = 0; i < mv.length; i++) if (mv[i].kind !== 'place') return '混进了 ' + mv[i].kind;
    return true;
  });

  /* 7 */
  test('王（8 号点）开局可跳吃 12/13/14 三枚大臣', function () {
    const st = mk();
    const eats = R.movesOf(st, 8).filter(function (m) { return m.kind === 'eat'; });
    const got = eats.map(function (m) { return m.over; }).sort(function (a, b) { return a - b; });
    if (!eq(got, [12, 13, 14])) return '实际吃掉 ' + JSON.stringify(got);
    return true;
  });

  /* 8 */
  test('跳吃落点必须是空点：16 号点被占时不能吃 12', function () {
    const st = mk();
    st.board[16] = MIN;                 // (4,0) 被占
    const eats = R.movesOf(st, 8).filter(function (m) { return m.kind === 'eat'; });
    for (let i = 0; i < eats.length; i++) if (eats[i].over === 12) return '落点被占仍然允许吃';
    return true;
  });

  /* 9 */
  test('中间没有大臣时不能跳吃', function () {
    const st = mk();
    st.board[13] = EMPTY;               // (3,2) 清空
    const eats = R.movesOf(st, 8).filter(function (m) { return m.kind === 'eat'; });
    for (let i = 0; i < eats.length; i++) if (eats[i].over === 13) return '中间没子仍然允许跳过';
    return true;
  });

  /* 10 */
  test('放满 16 枚大臣后自动进入走子阶段', function () {
    let st = mk({ turn: MIN });
    for (let n = 0; n < 16; n++) {
      const place = R.legalMoves(st).filter(function (m) { return m.kind === 'place'; })[0];
      if (!place) return '第 ' + (n + 1) + ' 手找不到可放的点';
      st = Object.assign({}, st, R.applyMove(st, place));
      st.turn = MIN;                    // 强制大臣连放，模拟添子阶段
    }
    if (st.phase !== 2) return 'phase 仍是 ' + st.phase;
    if (st.inHand !== 0) return '手里还剩 ' + st.inHand;
    return true;
  });

  /* 11 */
  test('走子阶段大臣只能 move，不能再 place', function () {
    const st = mk({ turn: MIN, phase: 2, inHand: 0 });
    const mv = R.legalMoves(st);
    if (!mv.length) return '没有任何走法';
    for (let i = 0; i < mv.length; i++) if (mv[i].kind !== 'move') return '出现 ' + mv[i].kind;
    return true;
  });

  /* 12 */
  test('applyMove 不修改入参（悔棋与搜索的前提）', function () {
    const st = mk();
    const before = st.board.slice();
    const next = R.applyMove(st, { kind: 'eat', from: 8, over: 12, to: 16 });
    if (!eq(st.board, before)) return '入参棋盘被改写';
    if (next.board[12] !== EMPTY) return '被吃的大臣没清掉';
    if (next.board[8] !== EMPTY || next.board[16] !== KING) return '王没落到新位置';
    if (next.captured !== 1) return '吃子计数 ' + next.captured;
    return true;
  });

  /* 13 */
  test('吃满 10 枚大臣判王胜', function () {
    const r = R.checkEnd(mk({ captured: 10 }));
    if (!r) return '没有判定结束';
    if (r.winner !== KING) return '判给了 ' + r.winner;
    return true;
  });

  /* 14 */
  test('总步数达到 300 判和棋', function () {
    const r = R.checkEnd(mk({ ply: 300 }));
    if (!r) return '没有判定结束';
    if (r.winner !== 0) return '判给了 ' + r.winner;
    return true;
  });

  /* 15 */
  test('轮到某方却无合法走法时判对方胜', function () {
    // 王只有一个点、四周全被大臣堵死 —— 直接构造：把 8 号点的所有邻居填满
    const st = mk({ turn: KING, phase: 2, inHand: 0 });
    st.board = L.initBoard.slice();
    st.board[8] = KING;
    for (let a = 0; a < L.adj[8].length; a++) st.board[L.adj[8][a]] = MIN;
    // 其余位置也填满，确保王真的没地方走
    for (let i = 0; i < N; i++) if (st.board[i] === EMPTY) st.board[i] = MIN;
    const r = R.checkEnd(st);
    if (!r) return '没有判定结束';
    if (r.winner !== MIN) return '判给了 ' + r.winner;
    return true;
  });

  /* 16 */
  test('37 个坐标都落在画布 bbox 内', function () {
    const bb = L.bbox;
    for (let i = 0; i < L.nodes.length; i++) {
      const x = L.nodes[i][0], y = L.nodes[i][1];
      if (x < bb[0] || x > bb[2]) return i + ' 号点 x=' + x + ' 越界';
      if (y < bb[1] || y > bb[3]) return i + ' 号点 y=' + y + ' 越界';
    }
    return true;
  });

  const sum = document.getElementById('sum');
  sum.textContent = '通过 ' + pass + ' / ' + (pass + fail) + ' 项' + (fail ? '（' + fail + ' 项失败）' : '，全部通过');
  sum.className = 'sum ' + (fail ? 'no' : 'ok');
})();
</script>
</body>
</html>
